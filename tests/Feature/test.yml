          name: search_columns
          in: query
          description: 'Array of column names to be searched.'
          schema:
            type: array
            items:
              type: string
            default: []
        -
          name: slug
          in: query
          description: 'Limit result set to posts with one or more specific slugs.'
          schema:
            type: array
            items:
              type: string
        -
          name: status
          in: query
          description: 'Limit result set to posts assigned one or more statuses.'
          schema:
            type: array
            items:
              type: string
            default: publish
        -
          name: tax_relation
          in: query
          description: 'Limit result set based on relationship between multiple taxonomies.'
          schema:
            type: string
        -
          name: menus
          in: query
          description: 'Limit result set to items with specific terms assigned in the menus taxonomy.'
          schema:
            oneOf:
              -
                title: 'Term ID List'
                type: array
                items:
                  type: integer
                description: 'Match terms with the listed IDs.'
              -
                title: 'Term ID Taxonomy Query'
                type: object
                properties:
                  terms:
                    type: array
                    items:
                      type: integer
                    description: 'Term IDs.'
                    default: []
                  operator:
                    enum:
                      - AND
                      - OR
                    type: string
                    description: 'Whether items must be assigned all or any of the specified terms.'
                    default: OR
                description: 'Perform an advanced term query.'
                additionalProperties: false
        -
          name: menus_exclude
          in: query
          description: 'Limit result set to items except those with specific terms assigned in the menus taxonomy.'
          schema:
            oneOf:
              -
                title: 'Term ID List'
                type: array
                items:
                  type: integer
                description: 'Match terms with the listed IDs.'
              -
                title: 'Term ID Taxonomy Query'
                type: object
                properties:
                  terms:
                    type: array
                    items:
                      type: integer
                    description: 'Term IDs.'
                    default: []
                description: 'Perform an advanced term query.'
                additionalProperties: false
        -
          name: menu_order
          in: query
          description: 'Limit result set to posts with a specific menu_order value.'
          schema:
            type: integer
