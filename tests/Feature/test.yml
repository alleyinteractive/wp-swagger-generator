          schema:
            type: string
        -
          name: password
          in: formData
          description: 'A password to protect access to the content and excerpt.'
          schema:
            type: string
        -
          name: title
          in: formData
          description: 'The title for the post.'
          schema:
            type: object
        -
          name: content
          in: formData
